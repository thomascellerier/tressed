[project]
name = "tressed"
authors = [
  { name="Thomas Cellerier", email="thomascellerier@gmail.com" },
]
version = "0.1.1"
description = "Deserialize and serialize types, in any order"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14"
dependencies = []

[project.urls]
Homepage = "https://github.com/thomascellerier/tressed"
Repository = "https://github.com/thomascellerier/tressed.git"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-benchmark>=5.3.0",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.17.0",
    "ruff>=0.17.3",
    "ty>=0.0.92",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "tressed"
module-root = "src"

[tool.ruff]
src = ["src", "tests"]

[tool.ruff.lint.per-file-ignores]
"src/tressed/loader/loaders.py" = ["SIM103"]
"tests/test_loader.py" = ["UP006", "UP007", "UP035", "UP045"]
"tests/test_specializers.py" = ["S102"]

[tool.ty.environment]
root = ["./src"]

[tool.pytest.ini_options]
pythonpath = [
  "src"
]

[tool.mypy]
warn_unused_ignores = true
files = [
  "src",
  "tests",
]
